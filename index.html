<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="ATHLETA Taiwan 2026.10–2027.05 品牌社群營運系統（中日雙語）：年度策略、每月進度、內容比例與 Point Credit。">
<meta property="og:title" content="ATHLETA Taiwan 品牌社群營運系統">
<meta property="og:description" content="年度策略・每月進度・內容比例・Point Credit｜年間戦略・月間の進捗・コンテンツ比率・Point Credit">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1115'/%3E%3Ctext x='32' y='42' font-size='22' text-anchor='middle' fill='%23d8a93b'%3E%E2%98%85%E2%98%85%E2%98%85%3C/text%3E%3C/svg%3E">
<title>ATHLETA Taiwan 品牌社群營運系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one long dark brand page, sticky section nav, every Chinese line paired with Japanese below it */
:root{
  --bg:#0f1115;--panel:#171a20;--line:#2a2f38;--ink:#eceae4;--soft:#cfcdc6;--muted:#9aa1ad;--ja:#b9b3a3;
  --accent:#d8a93b;--on-accent:#14161b;--danger:#e0644f;
  --c-product:#d8a93b;--c-people:#e0644f;--c-football:#4f9d6a;--c-culture:#5b8bd0;
  --f-zh:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--f-zh)}
[lang="ja"]{font-family:var(--f-ja)}
a{color:inherit}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* bilingual */
.ja{display:block;color:var(--ja);font-size:.88em;margin-top:2px;line-height:1.6}
body.l-zh .ja{display:none}
body.l-ja .zh{display:none}
body.l-ja .ja{color:inherit;font-size:1em;margin-top:0}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:16px 24px;padding:12px 24px;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:2px;text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent);font-weight:500}
#nav{display:flex;gap:4px;overflow-x:auto;flex:1 1 300px;min-width:0;scrollbar-width:none}
#nav a{padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
#nav a:hover,#nav a.on{background:var(--panel);color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:var(--muted);padding:5px 12px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.how{margin:12px 0 16px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--c-football)}.sync.bad i{background:var(--danger)}

main{max-width:1080px;margin:0 auto;padding:0 24px}
section{padding-block:72px 56px;border-top:1px solid var(--line)}
section.hero{border:0;padding-top:72px}
h1{font-size:clamp(28px,5vw,50px);line-height:1.3;margin:8px 0 12px;font-weight:900;text-wrap:balance}
h1 .ja{font-size:.52em;font-weight:500;margin-top:10px;line-height:1.5}
h2{font-size:28px;margin:0 0 12px;letter-spacing:1px;line-height:1.3}
h2 small{display:inline-block;margin-right:12px;color:var(--accent);font-size:14px;letter-spacing:2px}
h2 .sub{display:block;font-size:17px;font-weight:500;color:var(--soft);letter-spacing:0;margin-top:4px}
h3{font-size:18px;margin:40px 0 10px;text-wrap:balance}
.eyebrow{color:var(--accent);letter-spacing:3px;font-size:13px;margin:0}
.stars{color:var(--accent);font-size:22px;letter-spacing:8px;margin:0 0 20px}
.lead{font-size:18px;color:var(--soft);max-width:760px}
.muted{color:var(--muted)}
.muted .ja{color:var(--muted);opacity:.85}
.big{font-size:26px;font-weight:700;margin:4px 0;line-height:1.35}
.timeline-mini{display:flex;flex-wrap:wrap;gap:12px 0;list-style:none;padding:0;margin:0 0 32px;border-left:2px solid var(--accent)}
.timeline-mini li{padding:0 28px 0 14px;color:var(--muted);font-size:14px}
.timeline-mini b{display:block;color:var(--ink);font-size:18px}
.home-grid,.grid4,.grid5,.cols{display:grid;gap:16px}
.home-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cols{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:32px}
.cols>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h3,.card h4{margin:0 0 6px;font-size:16px}
.card p{margin:6px 0;font-size:14px;color:#c4c2bb}
.card .tag .ja{display:inline;margin-left:6px;font-size:1em;color:inherit}
body.l-ja .card .tag .ja{margin-left:0}
.card .tag{display:inline-block;font-size:11px;letter-spacing:2px;font-weight:700;margin-bottom:6px}
.ladder{color:var(--accent)!important;font-size:15px!important}
.ladder .ja{color:var(--accent);opacity:.8}
.rows>div{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows>div:last-child{border-bottom:0}
tbody tr:last-child td{border-bottom:0}
.rows b{color:var(--accent)}
.rows b .ja{color:var(--accent);opacity:.8}
blockquote{margin:0 0 12px;padding:14px 18px;border-left:3px solid var(--accent);font-size:20px;background:var(--panel);border-radius:0 12px 12px 0}
blockquote .ja{font-size:.8em}
cite{display:block;font-size:13px;color:var(--muted);margin-top:6px;font-style:normal}
.ratios{display:grid;gap:10px}
.ratio{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ratio .stack{display:flex;height:30px;border-radius:8px;overflow:hidden}
.ratio .stack:not(.none)>span{display:grid;place-items:center;color:#10131a;font-weight:700;font-size:12px}
.mix{display:grid;gap:8px;margin-top:6px}
.mix .ratio{grid-template-columns:150px 1fr}
.mix .ratio>span:first-child .ja{font-size:11px}
.stack.none{background:transparent;border:0;color:var(--muted);font-size:12px;display:block!important;text-align:center;height:auto;min-height:30px;line-height:1.5;padding:5px 8px}
.stack.none .ja{display:inline;margin:0 0 0 6px;font-size:1em;color:var(--muted)}
body.l-ja .stack.none .ja{margin:0}
.mixtable td,.mixtable th{padding:6px 10px}
.gap-up{color:var(--c-people)}.gap-down{color:var(--c-culture)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.rules{padding-left:22px}.rules li{margin:10px 0;color:#d4d2cb}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.tabs button.is-draft:not(.on){opacity:.75}
.tabs button small{font-size:11px;opacity:.75}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.detail h3{margin:0 0 4px;font-size:22px}
.detail dl{display:grid;grid-template-columns:110px 1fr;gap:12px 16px;margin:16px 0 0;font-size:14px}
.detail dt{color:var(--accent);font-weight:700}
.detail dt .ja{color:var(--accent);opacity:.8}
.detail dd{margin:0;color:#d4d2cb;min-width:0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:820px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.steps{grid-template-columns:1fr}}
.steps .card>b{color:var(--accent);font-size:12px;letter-spacing:2px}
.form{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.form input,.form select,.form textarea{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:10px;font-size:14px;min-width:0}
.form input{flex:1 1 140px}.form select{flex:1 1 130px}
.form .wide{flex:2 1 260px}
.form textarea{flex:1 1 100%;min-height:64px}
.form button{background:var(--accent);color:var(--on-accent);border:0;padding:9px 20px;border-radius:10px;font-weight:700;cursor:pointer;line-height:1.3}
.form button .ja{color:var(--on-accent);font-size:.8em;margin:0}
.form[aria-disabled="true"]{opacity:.5;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chips button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.chips button.on{border-color:var(--accent);color:var(--accent)}
.table-wrap{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:1px}
th .ja{font-size:11px;letter-spacing:0}
td{font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.del{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;border-radius:8px;padding:2px 8px;font-size:13px;white-space:nowrap}
.del.arm{border-color:var(--danger);color:var(--danger)}
td select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#10131a}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px}
.checks label.done{opacity:.55}
.checks input{accent-color:var(--accent);margin-top:6px;flex:none}
.checks small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.checks small .ja{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:14px}
.bar div{height:100%;background:var(--accent);width:0;transition:width .3s}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin:4px 0 4px}
.mhead h3{margin:0;font-size:22px}
.draft{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
.draft .ja{display:inline;color:var(--accent);font-size:1em;margin:0 0 0 6px}
body.l-ja .draft .ja{margin:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:16px;margin-top:16px}
.mgrid>*{min-width:0}
.group h4{margin:0 0 10px;font-size:15px;color:var(--accent)}
.group h4 .ja{color:var(--accent);opacity:.8}
.group+.group{margin-top:22px}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tasks li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.tasks li:last-child{border-bottom:0}
.tasks .box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;margin-top:4px;display:grid;place-items:center;font-size:11px;color:var(--on-accent)}
.tasks li.done .box{background:var(--accent);border-color:var(--accent)}
.tasks li.done .txt{opacity:.55;text-decoration:line-through}
.tasks .meta{display:block;font-size:12px;color:var(--muted)}
.pc{margin-top:28px;padding-top:20px;border-top:1px dashed var(--line)}
.pc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.pc-head h4{margin:0;font-size:15px;color:var(--accent);letter-spacing:1px}
.pc-head h4 .ja{color:var(--accent);opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.tile small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted)}
.tile .lbl{font-size:12px;color:var(--soft)}
.tile .lbl .ja{font-size:11px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.tile.key{border-color:var(--accent)}
.tile.warn b{color:var(--danger)}
.pbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:4px 0 6px}
.pbar i{display:block;height:100%}
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.plegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px;border:1px solid var(--line);color:var(--muted)}
.st.COMPLETED{background:var(--c-football);border-color:var(--c-football);color:#10131a}
.st.IN.PROGRESS,.st.INPROGRESS{background:var(--accent);border-color:var(--accent);color:#10131a}
.st.SCHEDULED{border-color:var(--c-culture);color:var(--c-culture)}
tr.cancel td{opacity:.45;text-decoration:line-through}
.pc-rules{margin-top:20px}
.pc-rules summary{cursor:pointer;color:var(--soft);font-size:14px}
.notice{margin:12px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.notice:empty{display:none}
footer{margin-top:80px;padding:32px 16px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
@media(max-width:640px){
  .nav{padding:10px 16px;gap:8px 12px}
  #nav{order:3;flex-basis:100%}
  main{padding:0 16px}
  .ratio{grid-template-columns:1fr;gap:4px}
  .rows>div,.detail dl{grid-template-columns:1fr;gap:2px}
  .detail dd{margin-bottom:10px}
  h2{font-size:24px}
}
</style>
</head>
<body>

<header class="nav">
  <a class="brand" href="#home">ATHLETA <span>Taiwan</span></a>
  <nav id="nav" aria-label="Sections"></nav>
  <span id="sync" class="sync"><span id="sync-text"></span></span>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="both" id="lang-both">中日</button><button data-lang="zh" id="lang-zh">中文</button><button data-lang="ja" id="lang-ja">日本語</button>
  </div>
</header>

<main>
  <section id="home" class="hero">
    <p class="eyebrow">BRAND × CONTENT × FOOTBALL × CULTURE</p>
    <h1><span class="zh" lang="zh-Hant">在 2027 年十週年前，<br>重新讓台灣足球圈認識 ATHLETA。</span><span class="ja" lang="ja">2027年の10周年までに、<br>台湾サッカー界にもう一度ATHLETAを知ってもらう。</span></h1>
    <p class="stars">★ ★ ★</p>
    <ol id="timeline" class="timeline-mini"></ol>
    <div class="home-grid">
      <div class="card"><h3 id="h-now"></h3><p id="now-phase" class="big"></p><p id="now-focus" class="muted"></p></div>
      <div class="card"><h3 id="h-count"></h3><p id="countdown" class="big"></p><p class="muted">2027/05/01 ATHLETA Taiwan 10th Anniversary</p></div>
      <div class="card"><h3 id="h-month"></h3><p id="month-count" class="big"></p><p id="month-theme" class="muted"></p><div class="bar"><div id="month-bar"></div></div></div>
      <div class="card"><h3 id="h-ladder"></h3><p id="ladder" class="ladder"></p></div>
    </div>
  </section>

  <section id="brand">
    <h2 id="h2-brand"></h2>
    <p class="lead" id="brand-lead"></p>
    <div class="cols">
      <div><h3 id="h-situation"></h3><div id="situation" class="rows"></div></div>
      <div>
        <h3 id="h-spirit"></h3>
        <blockquote id="quote"></blockquote>
        <p class="muted" id="spirit-note"></p>
      </div>
    </div>
  </section>

  <section id="system">
    <h2 id="h2-system"></h2>
    <h3 id="h-pillars"></h3>
    <p class="muted" id="pillars-note"></p>
    <div id="pillars" class="grid4"></div>
    <h3 id="h-ratios"></h3>
    <p class="muted" id="ratios-note"></p>
    <div id="ratios" class="ratios"></div>
    <div class="legend" id="ratio-legend"></div>
    <h3 id="h-platforms"></h3>
    <div id="platforms" class="grid4"></div>
    <h3 id="h-shoots"></h3>
    <div id="shoots" class="grid5"></div>
    <p class="muted" id="shoots-note"></p>
    <h3 id="h-rules"></h3>
    <ol id="rules" class="rules"></ol>
  </section>

  <section id="calendar">
    <h2 id="h2-calendar"></h2>
    <div id="phase-tabs" class="tabs"></div>
    <div id="phase-detail" class="card detail"></div>
    <h3 id="h-monthly"></h3>
    <div id="monthly" class="steps"></div>
    <p class="muted" id="meeting-note"></p>
  </section>

  <section id="plan">
    <h2 id="h2-plan"></h2>
    <p class="lead" id="plan-lead"></p>
    <div id="month-tabs" class="tabs"></div>
    <div id="month-detail"></div>
    <details class="pc-rules" id="pc-rules"></details>
  </section>

  <section id="bank">
    <h2 id="h2-bank"></h2>
    <p class="lead" id="bank-lead"></p>
    <p class="how" data-how></p>
    <div id="bank-filters" class="chips"></div>
    <div id="bank-list" class="table-wrap"></div>
  </section>

  <section id="people">
    <h2 id="h2-people"></h2>
    <p class="lead" id="people-lead"></p>
    <div id="roles" class="grid4"></div>
    <h3 id="h-plist"></h3>
    <p class="how" data-how></p>
    <div id="people-list" class="table-wrap"></div>
  </section>


  <p id="notice" class="notice" role="status"></p>
</main>
<footer id="footer"></footer>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  // ---------- content: every string is [中文, 日本語] ----------
  var T = {
    now: ['現在進行到', '現在のフェーズ'],
    count: ['距離十週年', '10周年まで'],
    ladderH: ['認知階梯', '認知のステップ'],
    ladder: ['看見 → 認識 → 喜歡 → 認同 → 參與 → 到店／購買', '目にする → 知る → 好きになる → 共感する → 参加する → 来店・購入'],
    brand: ['品牌方向', 'ブランドの方向性'],
    brandLead: ['我們要建立的，不只是社群帳號：每一次拍攝、貼文與足球圈合作，都要留下可累積的品牌資產。', '私たちが作るのはSNSアカウントだけではありません。撮影、投稿、サッカー界とのコラボ、その一つひとつを積み上がるブランド資産として残していきます。'],
    situation: ['現在最需要解決的事', '今いちばん解決すべきこと'],
    spirit: ['品牌精神', 'ブランドの精神'],

      }).join('') + '</tbody></table>');

  function renderPeople() {

      return '<tr><td>' + esc(p.name) + '</td><td class="wrap">' + V(p.role) + '</td><td>' + optLabel('stage', p.stage) + '</td></tr>';
    }).join('') + '</tbody></table>');
  }

  // ---------- monthly plan ----------
  var months = (D.months || []).slice().sort(function (a, b) { return a.month < b.month ? -1 : 1; });
  var nowKey = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2);
  var activeMonth = months.some(function (m) { return m.month === nowKey; }) ? nowKey : (months[0] && months[0].month);
  function monthLabel(m) { var p = m.split('-'); return p[0] + '.' + p[1]; }
  function allTasks(m) { return (m.groups || []).reduce(function (a, g) { return a.concat(g.tasks || []); }, []); }
  function countDone(m) { var t = allTasks(m); return { n: t.filter(function (x) { return x.done; }).length, t: t.length }; }

  function renderHomeMonth() {
    var m = months.filter(function (x) { return x.month === nowKey; })[0];

  }

  function renderMonths() {
    if (!months.length) { set('month-tabs', ''); set('month-detail', '<div class="empty">' + B(T.noMonth) + '</div>'); return; }
    set('month-tabs', months.map(function (m) {
      return '<button data-m="' + esc(m.month) + '" class="' + (m.month === activeMonth ? 'on' : '') + (m.draft ? ' is-draft' : '') + '"' + (m.draft ? ' title="' + esc(textFor(T.draftTag)) + '"' : '') + '>' + monthLabel(m.month) + (m.draft ? ' <small>' + esc(textFor(T.draftTag).split('・')[0]) + '</small>' : '') + '</button>';
    }).join(''));
    var m = months.filter(function (x) { return x.month === activeMonth; })[0];
    var c = countDone(m);
    var html = '<div class="card"><div class="mhead"><h3>' + monthLabel(m.month) + '</h3>' + (m.draft ? '<span class="draft">' + B(T.draftTag) + '</span>' : '') + '</div>' +
      '<p class="lead" style="margin:4px 0">' + V(m.theme) + '</p>' + pointsStrip(m) +
      '<p class="muted" style="margin:0">' + B(fill(T.tasksDone, { n: c.n, t: c.t })) + '</p>' + (c.n ? '<div class="bar"><div style="width:' + (c.n / c.t * 100) + '%"></div></div>' : '') +
      '<h4 style="margin:22px 0 4px;font-size:15px;color:var(--accent)">' + B(T.mix) + '</h4>' + renderMix([m], m.month) +
      '<div class="mgrid"><div>' + (m.groups || []).map(function (g) {
        return '<div class="group"><h4>' + V(g.name) + '</h4><ul class="tasks">' + (g.tasks || []).map(function (t) {
          var meta = [];
          if (t.owner) meta.push(B([T.owner[0] + t.owner, T.owner[1] + t.owner]));
          if (t.due) meta.push(B([T.due[0] + t.due, T.due[1] + t.due]));
          return '<li class="' + (t.done ? 'done' : '') + '"><span class="box" aria-hidden="true">' + (t.done ? '✓' : '') + '</span><span><span class="txt">' + V(t.t) + '</span>' + (meta.length ? '<span class="meta">' + meta.join('') + '</span>' : '') + '</span></li>';
        }).join('') + '</ul></div>';
      }).join('') + '</div><div><div class="group"><h4>' + B(T.shootList) + '</h4>' + renderShoots(m.shoots || []) + '</div></div></div>' + renderLog(m) + renderPoints(m) + '</div>';
    set('month-detail', html);
  }
  // ---------- planned vs actual mix ----------
  function phaseIndexFor(month) {
    var d = new Date(month + '-15T00:00:00');
    for (var i = 0; i < PHASES.length; i++) {
      if (d >= new Date(PHASES[i].start + 'T00:00:00') && d <= new Date(PHASES[i].end + 'T23:59:59')) return i;
    }
    return -1;
  }
  // completed = items in the month's content list with status 已發布
  function doneCounts(ms) {
    var c = PILLARS.map(function () { return 0; });
    ms.forEach(function (m) { (m.shoots || []).forEach(function (x) {
      var i = PILLARS.map(function (p) { return p.key; }).indexOf(x.pillar);
      if (i >= 0 && x.status === '已發布') c[i]++;
    }); });
    return c;
  }
  function stack(vals) {
    return '<div class="stack">' + vals.map(function (v, i) {
      return v > 0 ? '<span style="width:' + v + '%;background:' + PILLARS[i].color + '">' + Math.round(v) + '</span>' : '';
    }).join('') + '</div>';
  }
  function mixRows(plan, counts) {
    var total = counts.reduce(function (a, b) { return a + b; }, 0);
    var actual = total ? counts.map(function (c) { return c / total * 100; }) : null;
    return { total: total, actual: actual, html:
      (plan ? '<div class="ratio"><span>' + B(T.planRow) + '</span>' + stack(plan) + '</div>' : '') +
      '<div class="ratio"><span>' + B(fill(T.actualRow, { n: total })) + '</span>' + (actual ? stack(actual) : '<div class="stack none"><span>' + B(T.noneYet) + '</span></div>') + '</div>' };
  }
  function renderMix(ms, month) {
    var pi = phaseIndexFor(month), plan = pi >= 0 ? RATIOS[pi][1] : null;
    var counts = doneCounts(ms), r = mixRows(plan, counts);
    var table = '<div class="table-wrap"><table class="mixtable"><thead><tr>' + T.mixCols.map(function (c) { return '<th>' + B(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      PILLARS.map(function (p, i) {
        var pv = plan ? plan[i] : null, av = r.actual ? Math.round(r.actual[i]) : null;
        var gap = pv != null && av != null ? av - pv : null;
        return '<tr><td><span class="pill" style="background:' + p.color + '">' + p.key + '</span></td><td>' + (pv != null ? pv + '%' : '—') + '</td><td>' + (av != null ? av + '%' : '—') + '</td><td class="' + (gap > 0 ? 'gap-up' : gap < 0 ? 'gap-down' : '') + '">' + (gap == null ? '—' : (gap > 0 ? '+' : '') + gap) + '</td><td>' + counts[i] + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    return '<div class="mix">' + r.html + '</div>' + table + '<p class="muted" style="font-size:13px;margin:6px 0 0">' + B(T.mixNote) + '</p>';
  }
  function renderPhaseRatios() {
    set('ratios', RATIOS.map(function (r, pi) {
      var inPhase = months.filter(function (m) { return phaseIndexFor(m.month) === pi; });
      var rows = mixRows(null, doneCounts(inPhase));
      return '<div class="mix" style="margin-bottom:8px"><div class="ratio"><span><b>' + r[0] + '</b><br>' + B(T.planRow) + '</span>' + stack(r[1]) + '</div>' +
        rows.html + '</div>';
    }).join('') + '<p class="muted" style="font-size:13px">' + B(T.ratiosActual) + '</p>');
  }

  // ---------- point credit (execution resources, never the plan itself) ----------
  var RATE = { 'Photography': 5, 'Reel': 10, 'Social Post': 2, 'Content Staff': 1, 'Article': 5, 'Campaign': null, 'Other': null };
  var TYPE_L = { 'Photography': ['專業攝影', 'プロ撮影'], 'Reel': ['Reel 短影音', 'リール動画'], 'Social Post': ['社群貼文', 'SNS投稿'], 'Content Staff': ['Content Staff', 'Content Staff'], 'Article': ['品牌／人物文章', 'ブランド・人物記事'], 'Campaign': ['特殊活動／PR／合作', '特別イベント・PR・コラボ'], 'Other': ['其他', 'その他'] };
  var UNIT = { 'Photography': ['小時', '時間'], 'Reel': ['支', '本'], 'Social Post': ['則', '本'], 'Content Staff': ['小時', '時間'], 'Article': ['篇', '本'], 'Campaign': ['項', '件'], 'Other': ['項', '件'] };
  var STATUS_L = { 'PLANNED': ['預計執行', '実施予定'], 'SCHEDULED': ['已排程', '日程確定'], 'IN PROGRESS': ['執行中', '進行中'], 'COMPLETED': ['已完成', '完了'], 'CANCELLED': ['取消', 'キャンセル'] };
  var PLANS = [
    { pts: 50, name: ['入門合作', '入門プラン'], fee: 44000 },
    { pts: 75, name: ['穩定合作', '安定プラン'], fee: 52000 },
    { pts: 100, name: ['標準合作', '標準プラン'], fee: 60000 },
    { pts: 125, name: ['深度合作', '深度プラン'], fee: 68000 }
  ];
  function planFor(m) {
    var P = (m.points && Number(m.points.purchased)) || 0;
    var plan = PLANS.filter(function (x) { return x.pts === P; })[0];
    var fee = m.points && typeof m.points.fee === 'number' ? m.points.fee : plan ? plan.fee : null;
    return { plan: plan, fee: fee, per: fee != null && P ? fee / P : null };
  }
  function nt(n) { return 'NT$' + Math.round(n).toLocaleString('en-US'); }
  function uRate(u) { return typeof u.rate === 'number' ? u.rate : RATE[u.type]; }
  // explicit `points` wins (Campaign / Other / Article above the base rate), else qty × rate
  function uPts(u) { if (typeof u.points === 'number') return u.points; var r = uRate(u); return r == null ? 0 : r * (Number(u.qty) || 0); }
  var KIND = { 'EVENT': ['C', ['活動／賽事', 'イベント・試合']], 'PRODUCT': ['A', ['商品', '商品']], 'PEOPLE': ['B', ['人物', '人物']], 'STORE': ['D', ['門市日常', '店舗の日常']], 'CAMPAIGN': ['E', ['品牌企劃', 'ブランド企画']] };
  var FORMAT = { 'PHOTO': ['平面', '写真'], 'VIDEO': ['影像', '映像'], 'BOTH': ['平面＋影像', '写真＋映像'] };
  // shoot-log entries that carry points become Point Usage rows, so nothing is entered twice
  function allUsage(m) {
    return (m.usage || []).concat((m.shootLog || []).filter(function (x) { return x.points; }).map(function (x) {
      return { date: x.date, task: x.title, content: x.content || x.title, pillar: x.pillar, type: x.points.type, qty: x.points.qty, points: x.points.points, status: x.points.status, note: x.note };
    }));
  }
  function hasPoints(m) { return !!(m.points || allUsage(m).length); }

  var PTS = (function () {
    var res = {}, carry = 0;
    months.forEach(function (m) {
      var P = (m.points && Number(m.points.purchased)) || 0, C = carry, A = P + C, used = 0, planned = 0;
      allUsage(m).forEach(function (u) {
        var p = uPts(u);
        if (u.status === 'COMPLETED') used += p; else if (u.status !== 'CANCELLED') planned += p;
      });
      // projection assumes planned work gets done; carry-over is spent first
      var proj = used + planned, fromC = Math.min(proj, C), fromP = Math.min(P, proj - fromC);
      var pLeft = P - fromP, cap = Math.round(P * 0.3), out = Math.min(pLeft, cap);
      res[m.month] = { P: P, C: C, A: A, used: used, planned: planned, remaining: A - used, unalloc: A - used - planned, cap: cap, carryOut: out, expiring: (C - fromC) + (pLeft - out), over: Math.max(0, proj - A) };
      carry = out;
    });
    return res;
  })();

  function pointsStrip(m) {
    var r = PTS[m.month]; if (!r || (!hasPoints(m) && !r.C)) return '';
    return '<p class="muted" style="margin:0 0 6px;font-size:13px">' + B(fill(T.pcStrip, { a: r.A, p: r.planned, u: r.used, r: r.remaining })) + '</p>';
  }

  function renderPoints(m) {
    var r = PTS[m.month];
    var head = '<div class="pc"><div class="pc-head"><h4>' + B(T.pcTitle) + '</h4></div><p class="muted" style="font-size:13px;margin:4px 0 0">' + B(T.pcRole) + '</p>';
    if (!hasPoints(m) && !r.C) return head + '<div class="empty" style="margin-top:12px">' + B(T.pcEmpty) + '</div></div>';
    var pf = planFor(m);
    var planTiles = '<div class="tiles">' +
      '<div class="tile"><small>PLAN</small><span class="lbl">' + B(T.pcPlan) + '</span><b>' + (pf.plan ? r.P + ' Points' : r.P ? r.P + ' Points' : '—') + '</b>' + (pf.plan ? '<span class="lbl">' + B(pf.plan.name) + '</span>' : r.P ? '<span class="lbl">' + B(T.pcCustom) + '</span>' : '') + '</div>' +
      '<div class="tile"><small>MONTHLY FEE</small><span class="lbl">' + B(T.pcFee) + '</span><b>' + (pf.fee != null ? nt(pf.fee) : '—') + '</b></div>' +
      '<div class="tile"><small>PER POINT</small><span class="lbl">' + B(T.pcPer) + '</span><b>' + (pf.per != null ? nt(pf.per) : '—') + '</b></div></div>';
    var vals = [r.P, r.C, r.A, r.planned, r.used, r.remaining, r.unalloc, r.carryOut, r.expiring];
    var tiles = '<div class="tiles">' + T.pcTiles.map(function (t, i) {
      var cls = (i === 2 || i === 5) ? ' key' : (i === 6 && r.unalloc < 0) || (i === 8 && r.expiring > 0) ? ' warn' : '';
      return '<div class="tile' + cls + '"><small>' + t[0] + '</small><span class="lbl">' + B(t[1]) + '</span><b>' + vals[i] + '</b></div>';
    }).join('') + '</div>';
    var A = Math.max(r.A, r.used + r.planned) || 1;
    var bar = '<div class="pbar"><i style="width:' + (r.used / A * 100) + '%;background:var(--c-football)"></i><i style="width:' + (r.planned / A * 100) + '%;background:var(--accent)"></i></div>' +
      '<div class="plegend">' + T.pcBar.map(function (l, i) { return '<span><i style="background:' + ['var(--c-football)', 'var(--accent)', 'var(--line)'][i] + '"></i>' + esc(textFor(l)) + ' ' + [r.used, r.planned, Math.max(0, r.unalloc)][i] + '</span>'; }).join('') + '</div>';
    var notes = '<p class="muted" style="font-size:13px;margin:10px 0 0">' + B(fill(T.pcCarryNote, { cap: r.cap, c: r.C })) + '</p>' +
      (r.over ? '<p class="notice" style="border-color:var(--danger);color:var(--danger)">' + B(fill(T.pcOver, { n: r.over })) + '</p>' : '');

    var list = allUsage(m).sort(function (a, b) { return String(a.date) < String(b.date) ? -1 : 1; });
    var usage = '<h4 style="margin:20px 0 8px;font-size:15px;color:var(--accent)">' + B(T.pcUsage) + '</h4>' + (!list.length ? '<div class="empty">' + B(T.pcNoUsage) + '</div>' :
      '<div class="table-wrap"><table><thead><tr>' + T.pcCols.map(function (c) { return '<th>' + B(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + list.map(function (u) {
        var unit = UNIT[u.type] || ['', ''], rate = uRate(u);
        return '<tr class="' + (u.status === 'CANCELLED' ? 'cancel' : '') + '"><td>' + esc(u.date) + '</td><td class="wrap">' + V(u.task) + (u.content ? '<span class="meta" style="display:block;font-size:12px;color:var(--muted)">' + B([T.pcServe[0] + (Array.isArray(u.content) ? u.content[0] : u.content), T.pcServe[1] + (Array.isArray(u.content) ? u.content[1] : u.content)]) + '</span>' : '') + '</td>' +
          '<td>' + (u.pillar ? '<span class="pill" style="background:' + pillarColor(u.pillar) + '">' + esc(u.pillar) + '</span>' : '') + '</td>' +
          '<td>' + esc(u.type) + (TYPE_L[u.type] ? '<span style="display:block">' + B(TYPE_L[u.type]) + '</span>' : '') + '</td>' +
          '<td>' + (u.qty != null ? B([u.qty + ' ' + unit[0], u.qty + ' ' + unit[1]]) : '—') + '</td><td>' + (typeof u.points === 'number' && rate == null ? '—' : rate) + '</td><td><b>' + uPts(u) + '</b></td><td>' + (pf.per != null ? nt(uPts(u) * pf.per) : '—') + '</td>' +
          '<td><span class="st ' + esc(String(u.status).replace(' ', '')) + '">' + esc(u.status) + '</span>' + (STATUS_L[u.status] ? '<span style="display:block;font-size:12px">' + B(STATUS_L[u.status]) + '</span>' : '') + '</td><td class="wrap">' + V(u.note) + '</td></tr>';
      }).join('') + '</tbody></table></div>');

    // which content plan items the points served
    var groups = {}, order = [];
    list.forEach(function (u) {
      if (u.status === 'CANCELLED') return;
      var key = (Array.isArray(u.content) ? u.content[0] : u.content) || '';
      if (!groups[key]) { groups[key] = { content: u.content, pillar: u.pillar, n: 0, planned: 0, used: 0 }; order.push(key); }
      var g = groups[key]; g.n++; if (u.status === 'COMPLETED') g.used += uPts(u); else g.planned += uPts(u);
    });
    var byContent = !order.length ? '' : '<h4 style="margin:20px 0 8px;font-size:15px;color:var(--accent)">' + B(T.pcByContent) + '</h4><div class="table-wrap"><table><thead><tr>' + T.pcContentCols.map(function (c) { return '<th>' + B(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      order.map(function (k) { var g = groups[k]; return '<tr><td class="wrap">' + (g.content ? V(g.content) : B(T.pcNoContent)) + '</td><td>' + (g.pillar ? '<span class="pill" style="background:' + pillarColor(g.pillar) + '">' + esc(g.pillar) + '</span>' : '') + '</td><td>' + g.n + '</td><td>' + g.planned + '</td><td>' + g.used + '</td><td><b>' + (g.planned + g.used) + '</b></td></tr>'; }).join('') + '</tbody></table></div>';

    var money = pf.per == null ? '' : '<p style="font-size:13px;margin:10px 0 0">' + B(fill(T.pcMoney, { u: nt(r.used * pf.per), p: nt(r.planned * pf.per), r: nt(Math.max(0, r.unalloc) * pf.per), e: nt(r.expiring * pf.per) })) + '</p><p class="muted" style="font-size:12px;margin:2px 0 0">' + B(T.pcMoneyNote) + '</p>';
    return head + planTiles + tiles + bar + money + notes + usage + byContent + '</div>';
  }

  function renderLog(m) {
    var list = (m.shootLog || []).slice().sort(function (a, b) { return String(a.date) < String(b.date) ? -1 : 1; });
    var html = '<div class="pc"><div class="pc-head"><h4>' + B(T.logTitle) + '</h4></div><p class="muted" style="font-size:13px;margin:4px 0 10px">' + B(T.logNote) + '</p>';
    if (!list.length) return html + '<div class="empty">' + B(T.logEmpty) + '</div></div>';
    return html + '<div class="table-wrap"><table><thead><tr>' + T.logCols.map(function (c) { return '<th>' + B(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + list.map(function (x) {
      var k = KIND[x.kind], meta = [];
      if (x.location) meta.push(B([T.logWhere[0] + x.location, T.logWhere[1] + x.location]));
      if (x.people) meta.push(B([T.logWho[0] + x.people, T.logWho[1] + x.people]));
      if (x.output) meta.push(B([T.logOut[0] + (Array.isArray(x.output) ? x.output[0] : x.output), T.logOut[1] + (Array.isArray(x.output) ? x.output[1] : x.output)]));
      return '<tr><td>' + esc(x.date) + '</td><td class="wrap"><b>' + V(x.title) + '</b>' + meta.map(function (t) { return '<span style="display:block;font-size:12px;color:var(--muted)">' + t + '</span>'; }).join('') + '</td>' +
        '<td>' + (k ? '<span class="st">SHOOT ' + k[0] + '</span><span style="display:block">' + B(k[1]) + '</span>' : esc(x.kind)) + '</td>' +
        '<td>' + (x.pillar ? '<span class="pill" style="background:' + pillarColor(x.pillar) + '">' + esc(x.pillar) + '</span>' : '') + '</td>' +
        '<td>' + (FORMAT[x.format] ? B(FORMAT[x.format]) : esc(x.format)) + '</td><td>' + (x.hours != null ? B([x.hours + ' 小時', x.hours + ' 時間']) : '—') + '</td>' +
        '<td><b>' + (x.points ? uPts({ type: x.points.type, qty: x.points.qty, points: x.points.points }) : '—') + '</b></td><td class="wrap">' + V(x.note) + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
  }

  function renderPcRules() {
    set('pc-rules', '<summary>' + B(T.pcRules) + '</summary><div class="card" style="margin-top:10px">' +
      '<h4 style="margin:0 0 4px;font-size:15px;color:var(--accent)">' + B(T.pcPlans) + '</h4><p class="muted" style="font-size:13px;margin:0 0 8px">' + B(T.pcPlansNote) + '</p>' +
      '<div class="table-wrap" style="margin-bottom:18px"><table><thead><tr>' + T.pcPlanCols.map(function (c) { return '<th>' + B(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      PLANS.map(function (x) { return '<tr><td>' + x.pts + ' Points</td><td>' + B(x.name) + '</td><td>' + x.pts + '</td><td>' + Math.round(x.pts * 0.3) + ' Points</td><td>' + nt(x.fee) + '</td><td>' + nt(x.fee / x.pts) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="table-wrap"><table><thead><tr>' + T.pcRuleCols.map(function (c) { return '<th>' + B(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      T.pcRuleRows.map(function (r) { return '<tr><td>' + B(r[0]) + '</td><td>' + B(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<ul style="margin:12px 0 0;padding-left:20px;font-size:14px">' + T.pcCarryRules.map(function (x) { return '<li style="margin:6px 0">' + B(x) + '</li>'; }).join('') + '</ul></div>');
  }

  function renderShoots(list) {
    if (!list.length) return '<div class="empty">' + B(T.shootEmpty) + '</div>';
    return '<div class="table-wrap"><table><thead><tr>' + T.shootCols.map(function (c) { return '<th>' + B(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + list.map(function (x) {
      return '<tr><td>' + (x.pillar ? '<span class="pill" style="background:' + pillarColor(x.pillar) + '">' + esc(x.pillar) + '</span>' : '') + '</td><td class="wrap">' + V(x.title) + '</td><td>' + esc(x.person) + '</td><td>' + esc(x.date) + '</td><td>' + optLabel('shoot', x.status) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }
  $('month-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    activeMonth = b.getAttribute('data-m'); renderMonths();
  });

  function renderAll() { renderPcRules(); renderPhaseRatios(); renderHomeMonth(); renderMonths(); renderBank(); renderPeople(); }
  applyLang();

  // ---------- scroll spy ----------
  var links = [].slice.call(document.querySelectorAll('#nav a'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id); }); });
    }, { rootMargin: '-40% 0px -55% 0px' });
    NAV.forEach(function (n) { var s = $(n[0]); if (s) io.observe(s); });
  }
})();
</script>
</body>
</html>
